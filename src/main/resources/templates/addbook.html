<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Add Book</title>
</head>

<body>

    <h1>Add book</h1>

    <form th:object="${book}" th:action="@{/save}" method="post">

        <label for="title">Title</label>
        <input type="text" id="title" th:field="*{title}" />

        <br><br>

        <label for="author">Author</label>
        <input type="text" id="author" th:field="*{author}" />

        <br><br>

        <label for="publicationYear">Publication Year</label>
        <input type="number" id="publicationYear" th:field="*{publicationYear}" />

        <br><br>

        <label for="isbn">ISBN</label>
        <input type="text" id="isbn" th:field="*{isbn}" />

        <br><br>

        <label for="price">Price</label>
        <input type="number" step="0.01" id="price" th:field="*{price}" />

        <br><br>

        <label for="catlist">Category</label>
        <select id="catlist" th:field="*{category}">
            <option th:each="category : ${categories}" th:value="${category.id}" th:text="${category.name}">
            </option>
        </select>
        <br><br>

        <input type="submit" value="Save">

    </form>

</body>

</html>
